[workspace]
resolver = "2"
members = [
    "packages/cli",
    "packages/registry-build",
]

[workspace.dependencies.cu]
package = "pistonite-cu"
version = "0.9.9"

[workspace.dependencies]
flate2 = "1.1.11"
full_moon = { version = "3.0.0", default-features = false }
libloading = "0.9.1"
mdbook-markdown = "0.5.4"
mdbook-preprocessor = "0.5.4"
regex = "1.13.2"
serde = "1"
tree-sitter = "0.27.2"
tree-sitter-language = "0.1.9"
ureq = "3.5.2"
